# /etc/nginx/sites-available/moneyrag.prince.sh
# TLS lines are added by `certbot --nginx -d moneyrag.prince.sh`.
server {
    listen 80;
    listen [::]:80;
    server_name moneyrag.prince.sh;
    server_tokens off;

    client_max_body_size 8k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Overwrite, never append: the app rate-limits on the first X-Forwarded-For
    # entry, so a client-supplied value must not survive the proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location = /ask/stream {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }
}
